<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1611" />
    <meta name="description" content="Ritmo de producción: maderera, mina, campo y granja abastecen a la villa, cada uno a su ritmo." />
    <link rel="icon" href="data:," />
    <title>Ritmo de producción · Gear Up</title>
    <script type="module" crossorigin src="/gearup-playtests/pr-preview/pr-271/assets/productionRhythm-C_ELW0Pp.js"></script>
    <link rel="modulepreload" crossorigin href="/gearup-playtests/pr-preview/pr-271/assets/rolldown-runtime-8BhlS34s.js">
    <link rel="modulepreload" crossorigin href="/gearup-playtests/pr-preview/pr-271/assets/modulepreload-polyfill-BwpvBbVl.js">
    <link rel="stylesheet" crossorigin href="/gearup-playtests/pr-preview/pr-271/assets/productionRhythm-CqfF5nXP.css">
  </head>
  <body>
    <header class="masthead">
      <a href="./" class="wordmark lab-home-link" aria-label="Volver al mapa de labs"><span class="crest" aria-hidden="true"></span><span class="brand">Gear Up</span><span class="brand-sub">Labs</span></a>
      <div class="title"><h1>Ritmo de producción</h1><p id="date" class="date" aria-live="polite"></p></div>
    </header>
    <main class="lab">
      <section class="panel panel--map" aria-labelledby="map-heading">
        <h2 id="map-heading">El valle</h2>
        <div id="valley" class="valley-wrap"></div>
        <div id="year" class="year-wrap"></div>
        <div class="controls" role="group" aria-label="Controles de tiempo">
          <button id="play" class="primary" aria-pressed="false">▶ Reproducir</button>
          <label>Velocidad
            <select id="speed">
              <option value="1">1 día/s</option>
              <option value="5" selected>5 días/s</option>
              <option value="30">30 días/s</option>
              <option value="real">Tiempo real</option>
            </select>
          </label>
          <label class="real">Horas por día <input id="real-hours" type="number" min="1" max="24" step="1" /></label>
          <button data-advance="1">+1 día</button>
          <button data-advance="30">+30 días</button>
          <button data-advance="365">+1 año</button>
          <button id="reset" class="quiet">Reiniciar</button>
        </div>
      </section>
      <section class="panel panel--village" aria-labelledby="village-heading">
        <h2 id="village-heading">La villa del titular</h2>
        <div id="village"></div>
      </section>
      <section class="panel panel--sites" aria-labelledby="sites-heading">
        <h2 id="sites-heading">Sites productivos</h2>
        <p class="hint">Cada Site produce a su ritmo y despacha solo hacia la villa, priorizando lo que más falta según el último informe que le llegó. Pulsa un espacio de tierra para cambiar su uso.</p>
        <div id="sites" class="sites"></div>
      </section>
      <section class="panel panel--log" aria-labelledby="log-heading">
        <h2 id="log-heading">Lo que ha pasado</h2>
        <div id="log"></div>
      </section>
    </main>
  </body>
</html>

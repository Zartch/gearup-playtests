<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gear Up Labs</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111318; color: #eef1f7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(880px, calc(100% - 32px)); }
    h1 { margin-bottom: 8px; }
    p { color: #aab2c0; }
    .grid { display: grid; gap: 12px; margin-top: 28px; }
    .card { color: inherit; text-decoration: none; border: 1px solid #303746; border-radius: 12px; padding: 18px; display: grid; gap: 6px; background: #181c24; }
    .card:hover { border-color: #65728a; background: #1d222c; }
    .card span { color: #aab2c0; }
    .back { display: inline-block; margin-top: 24px; color: #aab2c0; }
  </style>
</head>
<body>
  <main>
    <div>GEAR UP · GENERATED PUBLIC TOOLS</div>
    <h1>Labs</h1>
    <p>Independent browser tools published alongside the playable build. Each lab owns its route and runtime.</p>
    <div class="grid">
      <a class="card" href="./simulation-observatory/">
        <strong>Simulation Observatory</strong>
        <span>Inspect deterministic Reference World runs, events, entities, history and knowledge.</span>
      </a>
    </div>
    <a class="back" href="../">← Back to game</a>
  </main>
</body>
</html>

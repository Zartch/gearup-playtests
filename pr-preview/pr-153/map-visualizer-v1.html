<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map Visualizer v1</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #0c141b; color: #e4edf2; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .6rem 1rem; background: #111d27; border-bottom: 1px solid #2a3e4d; }
      header h1 { font-size: 1rem; margin: 0; } header small { color: #93a8b6; }
      .controls { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
      button { cursor: pointer; border: 1px solid #4d6b80; background: #1f3342; color: inherit; border-radius: 5px; padding: .4rem .65rem; font: inherit; }
      button:hover { background: #2c4a5e; } button:disabled { opacity: .4; cursor: default; } button:focus-visible { outline: 2px solid #70e7f5; }
      .layers { display: flex; flex-wrap: wrap; gap: .25rem .8rem; } .layers label { white-space: nowrap; }
      #banner { padding: .45rem 1rem; font-family: ui-monospace, monospace; font-size: .82rem; }
      #banner.current { background: #12321f; color: #9fe6b4; } #banner.stale { background: #4a3a16; color: #ffe0a3; } #banner.inconsistent { background: #4a1616; color: #ffb4b4; }
      main { display: grid; grid-template-columns: 1fr minmax(280px, 380px); min-height: 0; }
      #stage { position: relative; min-height: 0; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      aside { overflow: auto; border-left: 1px solid #2a3e4d; padding: .6rem .8rem 2rem; background: #0f1a23; }
      aside h2 { font-size: .9rem; margin: .9rem 0 .35rem; color: #9cc3d8; text-transform: uppercase; letter-spacing: .04em; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .6rem; margin: 0; font-size: .82rem; }
      dt { color: #93a8b6; } dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
      .refs { display: flex; flex-wrap: wrap; gap: .25rem; } .refs button { padding: .15rem .4rem; font-size: .78rem; font-family: ui-monospace, monospace; }
      .fresh-CURRENT { color: #9fe6b4; } .fresh-STALE { color: #ffd27f; font-weight: 600; } .fresh-INCONSISTENT { color: #ff8f8f; font-weight: 600; } .item { border-top: 1px solid #22323f; padding: .35rem 0; } table { border-collapse: collapse; font-size: .75rem; } td { padding: 0 .4rem; font-family: ui-monospace, monospace; } td:last-child { text-align: right; } .muted { color: #7f95a3; font-size: .8rem; }
      pre { white-space: pre-wrap; font-size: .75rem; margin: 0; color: #c6d6df; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55dvh auto; } aside { border-left: 0; border-top: 1px solid #2a3e4d; } body { overflow: auto; height: auto; } }
    </style>
    <script type="module" crossorigin src="/gearup-playtests/pr-preview/pr-153/assets/mapVisualizerV1-DqNWHRjo.js"></script>
    <link rel="modulepreload" crossorigin href="/gearup-playtests/pr-preview/pr-153/assets/modulepreload-polyfill-P2Xu9kJm.js">
  </head>
  <body>
    <header>
      <div><h1>Map Visualizer v1</h1><small>Developer-omniscient read-model debug view of a recorded headless session · not a Strategic View · Route ≠ roadbed</small></div>
      <div class="controls">
        <button id="prev" type="button">◀ Step</button>
        <button id="next" type="button">Step ▶</button>
        <span id="step" class="muted"></span>
      </div>
      <div class="controls">
        <button id="fit" type="button">Fit</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </div>
      <div class="layers" id="layers" aria-label="Layers"></div>
    </header>
    <div id="banner" role="status" aria-live="polite"></div>
    <main>
      <div id="stage"><canvas id="map" aria-label="Map view"></canvas></div>
      <aside>
        <h2>What is here</h2><div id="at-point" class="muted">Tap or click the map.</div>
        <h2>Selected entity</h2><div id="entity" class="muted">Nothing selected.</div>
        <h2>Step</h2><div id="step-detail"></div>
        <h2>Recorded junction diagnosis</h2><div id="junction" class="muted"></div>
      </aside>
    </main>
  </body>
</html>

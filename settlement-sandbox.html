<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Settlement Sandbox</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #0c141b; color: #e4edf2; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .6rem 1rem; background: #111d27; border-bottom: 1px solid #2a3e4d; }
      header h1 { font-size: 1rem; margin: 0; } header small { color: #93a8b6; }
      form#session { display: flex; flex-wrap: wrap; align-items: end; gap: .3rem .6rem; }
      form#session label { margin: 0; }
      input.bound { width: 4.2rem; } input#seed { width: 7rem; }
      button, select, input, textarea { border: 1px solid #4d6b80; background: #1f3342; color: inherit; border-radius: 5px; padding: .35rem .55rem; font: inherit; }
      textarea { width: 100%; font-family: ui-monospace, monospace; font-size: .78rem; }
      button { cursor: pointer; } button:disabled, select:disabled, input:disabled, textarea:disabled { opacity: .4; cursor: default; }
      main { display: grid; grid-template-columns: 1fr minmax(300px, 420px); min-height: 0; }
      #stage { position: relative; min-height: 0; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      aside { overflow: auto; border-left: 1px solid #2a3e4d; padding: .6rem .8rem 2rem; background: #0f1a23; }
      aside h2 { font-size: .85rem; margin: 1rem 0 .35rem; color: #9cc3d8; text-transform: uppercase; letter-spacing: .04em; }
      label { display: grid; gap: .15rem; margin: .3rem 0; font-size: .82rem; color: #93a8b6; }
      table { border-collapse: collapse; font-size: .78rem; width: 100%; } td, th { padding: .1rem .3rem; text-align: right; } td:first-child, th:first-child { text-align: left; }
      .muted { color: #7f95a3; font-size: .82rem; } .ok { color: #9fe6b4; } .ko { color: #ff8f8f; }
      #log { font-family: ui-monospace, monospace; font-size: .75rem; padding-left: 1.4rem; max-height: 14rem; overflow: auto; }
      .row { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55dvh auto; } aside { border-left: 0; border-top: 1px solid #2a3e4d; } body { overflow: auto; height: auto; } }
    </style>
    <script type="module" crossorigin src="/gearup-playtests/assets/settlementSandbox-Bgym9pti.js"></script>
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/preload-helper-B2kRDP_E.js">
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/rng-DaEszmZK.js">
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/settlement-sandbox-CItAstx2.js">
  </head>
  <body>
    <header>
      <div><h1>Settlement Sandbox</h1><small>LAB-ONLY · v3 · continuous city over the SpatialUnit area · <span id="mode-label"></span></small></div>
      <form id="session" autocomplete="off" novalidate>
        <label>Seed<input id="seed" type="number" value="20261014" /></label>
        <label>Origin x<input id="origin-x" class="bound" type="number" value="0" /></label>
        <label>Origin y<input id="origin-y" class="bound" type="number" value="0" /></label>
        <label>Terrain
          <select id="terrain"><option value="dry">dry</option><option value="river">river</option><option value="mountain">mountain</option></select>
        </label>
        <label>Bounds minX<input id="min-x" class="bound" type="number" placeholder="default" /></label>
        <label>minY<input id="min-y" class="bound" type="number" placeholder="default" /></label>
        <label>maxX<input id="max-x" class="bound" type="number" placeholder="default" /></label>
        <label>maxY<input id="max-y" class="bound" type="number" placeholder="default" /></label>
        <button id="new-session" type="submit">New session</button>
      </form>
      <span id="session-status" class="muted"></span>
      <a class="muted" href="./settlement-area.html">Settlement Area (H)</a>
    </header>
    <main>
      <div id="stage"><canvas id="stage-canvas" aria-label="City view"></canvas></div>
      <aside>
        <h2>City</h2><div id="summary"></div>
        <h2>Face</h2><div id="inspector" class="muted"></div>
        <div id="walk-panel"></div>
        <h2>Event</h2>
        <select id="intent-kind" aria-label="Intent"></select>
        <div id="intent-note" class="muted"></div>
        <div id="intent-fields"></div>
        <button id="intent-apply" type="button">Apply</button>
        <div id="intent-status" class="muted"></div>
        <h2>Log</h2><ol id="log"></ol>
        <div id="extra-panels"></div>
      </aside>
    </main>
  </body>
</html>

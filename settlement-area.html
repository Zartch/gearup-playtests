<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Settlement Area</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #0c141b; color: #e4edf2; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .6rem 1rem; background: #111d27; border-bottom: 1px solid #2a3e4d; }
      header h1 { font-size: 1rem; margin: 0; } header small, .muted { color: #93a8b6; }
      form { display: flex; flex-wrap: wrap; align-items: end; gap: .4rem .8rem; }
      label { display: grid; gap: .1rem; font-size: .8rem; color: #93a8b6; }
      button, select, input { border: 1px solid #4d6b80; background: #1f3342; color: inherit; border-radius: 5px; padding: .3rem .5rem; font: inherit; }
      input[type="number"] { width: 5.5rem; } input.bound { width: 4.5rem; } button { cursor: pointer; }
      #stage { position: relative; min-height: 0; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { padding: .45rem 1rem; background: #0f1a23; border-top: 1px solid #2a3e4d; font-family: ui-monospace, monospace; font-size: .8rem; }
      #status.ko { color: #ff8f8f; }
    </style>
    <script type="module" crossorigin src="/gearup-playtests/assets/settlementArea-Edl9JwfB.js"></script>
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/rng-DaEszmZK.js">
    <link rel="modulepreload" crossorigin href="/gearup-playtests/assets/settlement-sandbox-BJa9i8no.js">
    <link rel="stylesheet" crossorigin href="/gearup-playtests/assets/lab-navigation-20FZ0u4c.css">
  </head>
  <body>
    <header>
      <a class="lab-home-link" href="./" aria-label="Volver al mapa de labs">← Labs</a>
      <div><h1>Settlement Area</h1><small>LAB-ONLY · v3 · materialized area mesh · click a dotted SpatialUnit to materialize it</small></div>
      <form id="config" autocomplete="off" novalidate>
        <label>Seed<input id="seed" type="number" value="20261014" /></label>
        <label>Origin x<input id="origin-x" class="bound" type="number" value="0" /></label>
        <label>Origin y<input id="origin-y" class="bound" type="number" value="0" /></label>
        <label>Terrain
          <select id="terrain"><option value="dry">dry</option><option value="river">river</option><option value="mountain">mountain</option></select>
        </label>
        <label>Bounds minX<input id="min-x" class="bound" type="number" placeholder="default" /></label>
        <label>minY<input id="min-y" class="bound" type="number" placeholder="default" /></label>
        <label>maxX<input id="max-x" class="bound" type="number" placeholder="default" /></label>
        <label>maxY<input id="max-y" class="bound" type="number" placeholder="default" /></label>
        <button id="create" type="submit">Create</button>
      </form>
      <a class="muted" href="./settlement-sandbox.html">Settlement Sandbox v3</a>
    </header>
    <div id="stage"><canvas id="stage-canvas" aria-label="Settlement area"></canvas></div>
    <div id="status" role="status"></div>
  </body>
</html>
